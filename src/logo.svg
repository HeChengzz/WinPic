<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="20" height="20">
  <defs>
    <!-- 底座渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4CC2FF"/>
      <stop offset="50%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#6B4BFF"/>
    </linearGradient>

    <!-- 顶部高光（Win11 亚克力感） -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 卡片天空 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B7E3FF"/>
      <stop offset="100%" stop-color="#E7F4FF"/>
    </linearGradient>

    <!-- 远山 -->
    <linearGradient id="mBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AAEE8"/>
      <stop offset="100%" stop-color="#2E6FBF"/>
    </linearGradient>

    <!-- 近山 -->
    <linearGradient id="mFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E7FD6"/>
      <stop offset="100%" stop-color="#154C93"/>
    </linearGradient>

    <!-- 卡片投影 -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#012C55" flood-opacity="0.35"/>
    </filter>

    <!-- 内部裁剪 -->
    <clipPath id="cardClip">
      <rect x="112" y="132" width="288" height="248" rx="18"/>
    </clipPath>
  </defs>

  <!-- 圆角方形底座 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#gloss)"/>

  <!-- 白色照片卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="96" y="116" width="320" height="280" rx="28" fill="#ffffff"/>

    <g clip-path="url(#cardClip)">
      <!-- 天空 -->
      <rect x="112" y="132" width="288" height="248" fill="url(#sky)"/>

      <!-- 太阳 -->
      <circle cx="328" cy="200" r="36" fill="#FFC93C"/>

      <!-- 远山 -->
      <path d="M112 342 L190 240 L250 302 L320 226 L400 320 L400 380 L112 380 Z" fill="url(#mBack)"/>

      <!-- 近山 -->
      <path d="M112 380 L112 318 L180 258 L244 326 L296 284 L400 380 Z" fill="url(#mFront)"/>
    </g>

    <!-- 卡片描边（极淡） -->
    <rect x="112" y="132" width="288" height="248" rx="18" fill="none" stroke="#0B4A8F" stroke-opacity="0.08" stroke-width="2"/>
  </g>
</svg>